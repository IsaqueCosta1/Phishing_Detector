[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detector"
version = "0.1.0"
description = "Detector de phishing a partir de features de URL/página"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]
